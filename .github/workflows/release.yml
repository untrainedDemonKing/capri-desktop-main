# Выпуск релиза: проверяет код, собирает установщики Windows (64-битный и 32-битный) и публикует релиз на GitHub.
# Запуск вручную: вкладка Actions › Release › Run workflow. Тег по умолчанию — v и версия из package.json
# (0.6.0 → v0.6.0). Описание релиза собирает scripts/release-notes.js, «Что нового» берётся из .github/RELEASE_NEWS.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (пусто: v + версия из package.json)'
        required: false
        default: ''
      prerelease:
        description: 'Отметить как пре-релиз'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Установщик ${{ matrix.arch }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64   # 64-битная Windows, Electron из package.json
            script: dist
          - arch: ia32  # 32-битная Windows: Electron 44+ её не выпускает, берётся 43.8.3 (см. dist:32)
            script: dist:32
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # без подписи кода
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/Capri-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    name: Релиз
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # создать тег и релиз
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Тег и описание
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${TAG_INPUT:-v$VERSION}"
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Недопустимый тег: $TAG" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -l installers
          node scripts/release-notes.js installers > release-notes.md
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть. Удали его (и тег) на GitHub или укажи другой тег." >&2
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" installers/*.exe \
            --target "$GITHUB_SHA" \
            --title "Capri $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
