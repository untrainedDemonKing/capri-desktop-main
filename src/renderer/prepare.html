<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capri</title>
  <link rel="stylesheet" href="styles/prepare.css">
</head>
<body>
  <main class="prep">
    <header class="prep__head">
      <img class="prep__face" src="../../assets/capri/capri-face.png" alt="">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle" class="prep__sub"></p>
      </div>
    </header>

    <section id="groups" class="prep__groups"></section>

    <p id="summary" class="prep__summary" role="status" aria-live="polite"></p>

    <footer class="prep__foot">
      <label class="prep__never"><input id="never" type="checkbox"> <span id="neverLabel"></span></label>
      <div class="prep__btns">
        <button id="copy" type="button" class="btn"></button>
        <button id="retryAll" type="button" class="btn" hidden></button>
        <button id="skip" type="button" class="btn" hidden></button>
        <button id="close" type="button" class="btn btn--main"></button>
      </div>
    </footer>
  </main>
  <script src="js/prepare.js"></script>
</body>
</html>
